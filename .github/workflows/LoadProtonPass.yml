# Prueba de concepto para leer un secreto de Proton Pass
name: LoadProtonPass
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
 jobs:
  read-secret:
    runs-on: ubuntu-latest
    env:
      PROTON_PASS_KEY_PROVIDER: fs   # no hay keyring en el runner
    steps:
      - name: Login con PAT y leer secreto
        env:
          PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PAT }}
        run: |
          pass-cli login
          VALUE="$(pass-cli item view 'pass://Personal/Admin/Password')"
          echo "::$VALUE"
          echo "DEMO_SECRET=$VALUE" >> "$GITHUB_ENV"

      - name: Usar el secreto
        run: |
          echo "Longitud del secreto: ${#DEMO_SECRET}"   # nunca imprimas el valor
