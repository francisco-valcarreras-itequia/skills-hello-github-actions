# Prueba de concepto para leer un secreto de Proton Pass
# 1) Instalar pass-cli desde PS
# Invoke-WebRequest -Uri https://proton.me/download/pass-cli/install.ps1 -OutFile install.ps1; .\install.ps1
# 2) Generar token para la autenticación, que permitirá hacer login en pass-cli sin usuario ni contraseña
# cmd: pass-cli login | pass-cli pat create --name "gh-actions-poc" --expiration 1w
# 3) Crear Secret en repository con el nombre 'PROTON_PASS_PAT' y el token devuelto en el paso anterior
# 3) Listar cajas fuertes
# pass-cli vault list | pass-cli item list --vault-name "{cajafuerte}" | pass-cli item view --vault-name "{cajafuerte}" --item-title "{propiedad}"
name: LoadProtonPass
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-secret:
    runs-on: ubuntu-latest
    env:
      PROTON_PASS_KEY_PROVIDER: fs   # no hay keyring en el runner
    steps:
      - name: Instalar pass-cli
        run: |
          curl -fsSL https://proton.me/download/pass-cli/install.sh | bash
          # por si el instalador lo deja en ~/.local/bin, fuera del PATH
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Comprobar instalación
        run: |
          command -v pass-cli
          pass-cli --version
      - name: Login con PAT y leer secreto
        env:
          PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PAT }}
        run: |
          pass-cli login
          echo "--- Items en 'Personal' ---"
          pass-cli item list --vault-name "Personal" || true
          echo "-----------------------------------"
          VALUE="$(pass-cli item view 'pass://Personal/POCvalue/Password')"
          echo "DEMO_SECRET=$VALUE" >> "$GITHUB_ENV"
      - name: Usar el secreto
        run: |
          echo "Longitud del secreto: ${#DEMO_SECRET}"   # nunca imprimas el valor
          echo "Valor: $DEMO_SECRET"
